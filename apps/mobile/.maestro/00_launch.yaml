appId: ${APP_ID || "com.saecula.app"}
env:
  # Dev-client deep link that loads the Metro bundle directly, bypassing the
  # launcher/dev-menu screen. maestro.sh passes the host IP; this default
  # targets an emulator (10.0.2.2 == host loopback). Format:
  #   <scheme>://expo-development-client/?url=<url-encoded metro url>
  DEV_URL: ${DEV_URL || "saecula://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"}
---
# Shared bootstrap. Safe to run from any flow:
#  1. Clears app state and launches the app fresh (deterministic).
#  2. Waits for the login screen to be ready (JS bundle load).
#  3. Logs in with the seeded test account (test@saecula.app / saecula123).
#  4. Forces the UI language to Spanish via Settings.
# Every flow starts by including this helper.
- clearState
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 60000
- tapOn:
    id: "login-email"
- inputText: "test@saecula.app"
- tapOn:
    id: "login-password"
- inputText: "saecula123"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "home-prayers"
    timeout: 45000
- tapOn:
    id: "home-profile"
- extendedWaitUntil:
    visible:
      text: "PERFIL"
    timeout: 20000
- tapOn:
    id: "profile-settings"
- extendedWaitUntil:
    visible:
      id: "settings-back"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Español"
    direction: DOWN
- tapOn: "Español"
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      text: "PERFIL"
    timeout: 20000
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible:
      id: "home-prayers"
    timeout: 45000
- assertVisible: "Inicio"
