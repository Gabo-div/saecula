appId: com.saecula.app
---
# Shared bootstrap. Safe to run from any flow:
#  1. Clears app state and launches the app fresh (deterministic).
#  2. Waits for the login screen to be ready (JS bundle load).
#  3. Logs in with the seeded test account (test@saecula.app / saecula123).
#  4. Forces the UI language to Spanish via Settings.
# Every flow starts by including this helper.
- clearState
- stopApp
- launchApp
# Dismiss the React Native dev menu overlay if it appears (debug builds).
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 60000
- tapOn:
    id: "login-email"
- inputText: "test@saecula.app"
- tapOn:
    id: "login-password"
- inputText: "saecula123"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "home-prayers"
    timeout: 30000
- tapOn:
    id: "home-profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- tapOn:
    id: "profile-settings"
- extendedWaitUntil:
    visible:
      id: "settings-back"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Español"
    direction: DOWN
- tapOn: "Español"
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "profile-settings"
    timeout: 20000
- stopApp
- launchApp
# Dismiss the React Native dev menu overlay if it appears (debug builds).
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-prayers"
    timeout: 30000
- assertVisible: "Inicio"
