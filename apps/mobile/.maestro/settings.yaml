appId: ${APP_ID || "com.saecula.app"}
---
# Settings: theme mode, language switcher and translation default all work;
# the helper already forced Spanish, and switching persists (AsyncStorage).
- runFlow:
    file: 00_launch.yaml
- tapOn:
    id: "home-profile"
- assertVisible: "PERFIL"
- assertVisible: "test@saecula.app"
- tapOn:
    id: "profile-settings"
- assertVisible: "AJUSTES"
- assertVisible: "TEMA"
- assertVisible: "COLOR DE ACENTO"
- assertVisible: "IDIOMA"
# Theme mode switches.
- tapOn: "AMOLED"
- tapOn: "Claro"
- tapOn: "Oscuro"
# Language switcher: Español → English → back.
- tapOn: "English"
- assertVisible: "SETTINGS"
- tapOn: "Español"
- assertVisible: "AJUSTES"
# Translation default row.
- scrollUntilVisible:
    element:
      text: "Por defecto (según idioma)"
    direction: DOWN
- assertVisible: "Por defecto (según idioma)"
- tapOn:
    id: "settings-back"
- assertVisible: "PERFIL"
- tapOn:
    id: "tab-home"
- assertVisible: "Inicio"
