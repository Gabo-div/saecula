services:
  postgres:
    image: postgres:latest
    container_name: saecula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saecula
      POSTGRES_PASSWORD: saecula_dev_password
      POSTGRES_DB: saecula
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql (data lives in
      # a version-named subdirectory, enabling pg_upgrade across majors)
      - postgres_data:/var/lib/postgresql
      # Schema is applied by goose via `bun run migrate` (not on first boot),
      # so a single owner controls it across services.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saecula -d saecula"]
      interval: 5s
      timeout: 5s
      retries: 10

  memgraph:
    image: memgraph/memgraph:latest
    container_name: saecula-memgraph
    restart: unless-stopped
    # Bolt-compatible with the neo4j-go-driver. Community edition has auth
    # off by default, so the driver's credentials are accepted and ignored.
    command: ["--log-level=WARNING"]
    ports:
      - "7687:7687"   # Bolt protocol
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_logs:/var/log/memgraph
    healthcheck:
      # Memgraph exposes no HTTP endpoint; a Bolt TCP probe is enough.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7687'"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  memgraph_data:
  memgraph_logs:
